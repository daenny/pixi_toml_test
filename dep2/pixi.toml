# Second package in this repo, used to check what happens when a workspace pulls
# two packages from the SAME git repo but from DIFFERENT branches.

[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "repro_dep_other"
version = "2.0.0"
description = "Second package in the same repo, used to test two branches of one repo"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.host-dependencies]
hatchling = ">=1.27.0,<2"
python = ">=3.11,<3.14"

[package.run-dependencies]
python = ">=3.11,<3.14"
